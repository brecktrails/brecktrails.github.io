# Publishes the public/ folder to https://brecktrails.github.io every time main changes.
# Requires Settings → Pages → Source: "GitHub Actions".
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch: # also allows a manual "Run workflow" button on the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# If two pushes land close together, only the latest one gets published
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
